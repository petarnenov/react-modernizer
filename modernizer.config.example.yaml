# Copy to modernizer.config.yaml and point `target` at the codebase to modernize.
# Every key below is optional except `target`; the values shown are the defaults.
# `react-modernizer check-config` prints the full config with defaults filled in.

target: ../my-cra-app

# How the target runs its tests; `{testRunner}` in any command below stands for it.
# Create React App runs Jest only through react-scripts. A project running Jest directly: npx jest --ci
testRunner: CI=true npx react-scripts test --watchAll=false

source:
  include: ['src/**/*.{js,jsx}']
  exclude: # setting this replaces the defaults below
    - '**/*.test.{js,jsx}'
    - '**/*.spec.{js,jsx}'
    - '**/__tests__/**'
    - '**/setupTests.js'

order: dependency-graph # leaves first, so types flow upwards

steps:
  analyze: # reports bugs, never fixes them
    enabled: true
    lintCommand: npx eslint --format unix {file} # evidence for the model
    minLines: 0 # analyse every file
    # model: claude-haiku-4-5  # a cheaper model just for analysis
  characterize-tests: # pins current behaviour before anything changes
    enabled: true
    testCommand: '{testRunner} {testFile}'
    helpers: [] # e.g. [src/test-utils.js] — renderWithProviders and friends
    # model: claude-opus-5    # a step can use another model than model.default
  class-to-function: { enabled: true, skip: [error-boundary] }
  redux-connect-to-hooks: { enabled: false } # a separate decision
  js-to-ts: # needs a tsconfig.json in the target (Phase 0)
    enabled: true
    typecheckCommand: 'npx tsc --noEmit --incremental --tsBuildInfoFile {cache}/tsc.tsbuildinfo'
    testCommand: '{testRunner} {testFile}' # its own test: types cannot change what other tests see
    helpers: [] # e.g. [src/store/hooks.ts] — typed useAppSelector / useAppDispatch
  simplify:
    enabled: true
    minLines: 40 # smaller files are skipped without a model call
    testCommand: '{testRunner} --findRelatedTests {file}'
    typecheckCommand: 'npx tsc --noEmit --incremental --tsBuildInfoFile {cache}/tsc.tsbuildinfo'

gates:
  commands: # a string passes on exit 0; newErrorsOnly fails only on errors not there before
    - { run: 'npx eslint --format json {files}', newErrorsOnly: eslint }
    - {
        run: 'npx tsc --noEmit --incremental --tsBuildInfoFile {cache}/tsc.tsbuildinfo',
        newErrorsOnly: tsc,
      }
    - { run: '{testRunner} --findRelatedTests {files}', newErrorsOnly: jest }
  coverage: { min: 80 }
  forbid:
    [
      ': any',
      'as any',
      '@ts-ignore',
      '@ts-nocheck',
      '@ts-expect-error',
      'eslint-disable',
      'toMatchSnapshot',
    ]
  protectTestsFrom: characterize-tests
  timeoutSeconds: 600 # per gate command

# Accepted files are committed to `<current branch>-modernized`, created from the branch you have checked out.

retry: { perStep: 3, onFail: revert-and-report }

concurrency:
  workers: 1 # agents at once; override with --workers
  # gates: 1          # lint/tsc/jest runs at once; defaults to workers
  requestsPerMinute: 50

budget:
  maxTokensPerFile: 200000
  maxTotalCostUsd: null

batching: { by: directory, maxFiles: 40 }

model:
  provider: anthropic # anthropic | ollama
  default: claude-sonnet-5 # with ollama: gpt-oss:120b
  effort: high # low | medium | high | xhigh | max (ollama: xhigh and max think at high)
  # Ollama only:
  # baseUrl: https://ollama.com   # Ollama Cloud; or http://localhost:11434, which needs no key
  # apiKeyEnv: OLLAMA_API_KEY     # the variable holding the key; the key never goes in this file
