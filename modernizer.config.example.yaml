# Copy to modernizer.config.yaml and point `target` at the codebase to modernize.
# Every key below is optional except `target`; the values shown are the defaults.
# `react-modernizer check-config` prints the full config with defaults filled in.

target: ../my-cra-app

source:
  include: ['src/**/*.{js,jsx}']
  exclude: # setting this replaces the defaults below
    - '**/*.test.{js,jsx}'
    - '**/*.spec.{js,jsx}'
    - '**/__tests__/**'
    - '**/setupTests.js'

order: dependency-graph # leaves first, so types flow upwards

steps:
  analyze: { enabled: true } # reports bugs, never fixes them
  characterize-tests: { enabled: true } # pins current behaviour before anything changes
  class-to-function: { enabled: true, skip: [error-boundary] }
  redux-connect-to-hooks: { enabled: false } # a separate decision
  js-to-ts: { enabled: true, codemod: ts-migrate }
  simplify: { enabled: true }

gates:
  commands:
    - npx eslint {files}
    - npx tsc --noEmit --incremental
    - npx jest --findRelatedTests {files}
  coverage: { min: 80 }
  forbid: [': any', 'as any', '@ts-ignore', '@ts-nocheck', 'eslint-disable', 'toMatchSnapshot']
  protectTestsFrom: characterize-tests
  timeoutSeconds: 600 # per gate command

git:
  branch: modernizer/run # accepted files are committed here, one commit per file
  base: HEAD # where the run branch starts if it does not exist

retry: { perStep: 3, onFail: revert-and-report }

concurrency:
  workers: 1 # agents at once; override with --workers
  # gates: 1          # lint/tsc/jest runs at once; defaults to workers
  requestsPerMinute: 50

budget:
  maxTokensPerFile: 200000
  maxTotalCostUsd: null

batching: { by: directory, maxFiles: 40 }

model:
  default: claude-sonnet-5
